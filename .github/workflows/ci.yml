name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: adrai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d adrai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The tests drop and recreate every table in this database.
      TEST_DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/adrai_test
    steps:
      - uses: actions/checkout@v4

      # 3.11 matches the production image (Dockerfile: python:3.11-slim).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      # Install exactly what Heroku installs, so a requirement missing from
      # requirements.txt fails here rather than in production.
      - run: pip install -r requirements.txt -r requirements-test.txt

      # No API keys are configured: tests stub every LLM/embedding/tracing call
      # (see tests/conftest.py). Real-LLM checks are marked `live` and never run here.
      - run: pytest

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
