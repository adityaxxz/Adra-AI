version: '3.8'

# Local development databases only.
# Spins up PostgreSQL (port 5433) and Qdrant (port 6333) to match .env defaults.
# Usage: docker compose up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: adrai-postgres
    environment:
      POSTGRES_DB: adrai
      POSTGRES_USER: adrai
      POSTGRES_PASSWORD: adrai_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adrai"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: adrai-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  qdrant_data:
