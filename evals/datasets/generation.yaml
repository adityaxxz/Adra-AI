# Project-generation cases: prompt in, a new project out (planner -> architect -> coder -> integrator).
#
# source: seeded-verbatim  a prompt the repo owner actually typed or documented
#         seeded-inferred  a topic reconstructed from artifacts of the owner's real dev runs (NOT verbatim)
#         hand-written     authored for this suite
#
# Checks that always run (and are skipped when they don't apply): python/json/js syntax, project-local
# imports resolve, html script/link targets exist, js element ids exist in the html, no TODO/FIXME stubs.
# `expect` adds case-specific ones; see evals/evaluators/evaluate.py for the keys.
# `exec` checks run the output (only with --exec) and, when a `solution` is given, are proven satisfiable by it.

- id: gen-01-todo-web
  mode: generation
  source: seeded-verbatim
  prompt: Create a simple to-do list web application using HTML, CSS, and JavaScript
  expect:
    files_exist: ["*.html", "*.css", "*.js"]
    contains:
      - {file: "*.js", any: ["addEventListener", "onclick"]}
      - {file: "*.html", any: ["<button", "<input"]}
  judge:
    notes: The user must be able to add tasks, mark them complete and delete them.

- id: gen-03-blog-api
  mode: generation
  source: seeded-inferred
  # The route/field sentence was added on 2026-11-25 so the API can be exercised by the exec check below (it caught a
  # generated app that never created its tables, which only the LLM judge had noticed). Results before that date ran
  # the shorter prompt.
  prompt: >-
    Build a blog REST API using FastAPI and SQLite. Posts have a title, a body and a created time, and the API
    supports creating, listing, fetching, updating and deleting posts. Use the routes POST /posts, GET /posts,
    GET /posts/{id}, PUT /posts/{id} and DELETE /posts/{id}, with the JSON fields id, title and body.
  expect:
    files_exist: ["requirements.txt", "*.py"]
    declared_dependencies: true
    contains:
      - {file: "*.py", any: ["fastapi"]}
      - {file: "*.py", any: ["sqlite"]}
      - {file: "*.py", regex: '@\w+\.delete'}
      - {file: "*.py", regex: '@\w+\.(put|patch)'}
    exec:
      - name: the API works end to end on a fresh database
        timeout: 60
        snippet: |
          import importlib, os, re, sys
          sys.path.insert(0, os.getcwd())
          from fastapi import FastAPI
          from fastapi.testclient import TestClient

          app = None
          for name in ("app.main", "main", "app"):
              try:
                  mod = importlib.import_module(name)
              except ModuleNotFoundError as e:
                  if e.name in (name, name.split(".")[0]):
                      continue                    # no such module in this project: try the next layout
                  # a dependency the app declares but this machine lacks is not the app's fault; anything else is
                  missing, declared = e.name.split(".")[0].lower().replace("-", "_"), set()
                  if os.path.exists("requirements.txt"):
                      for line in open("requirements.txt", encoding="utf-8"):
                          line = line.split("#")[0].strip()
                          if line:
                              pkg = re.match("[A-Za-z0-9_.-]+", line)
                              if pkg:
                                  declared.add(pkg.group(0).lower().replace("-", "_"))
                  if missing in declared:
                      print(f"SKIP: the app needs the package {e.name!r}, which is not installed where the evals run")
                      sys.exit(0)
                  raise
              app = next((v for v in vars(mod).values() if isinstance(v, FastAPI)), None)
              if app is not None:
                  break
          assert app is not None, "no FastAPI app found in app/main.py, main.py or app.py"

          with TestClient(app) as c:                 # runs startup/lifespan, where many apps create their tables
              r = c.post("/posts", json={"title": "Hello", "body": "First post"})
              assert r.status_code in (200, 201), f"create: {r.status_code} {r.text[:200]}"
              pid = r.json()["id"]
              r = c.get("/posts")
              assert r.status_code == 200 and any(p["id"] == pid for p in r.json()), f"list: {r.status_code} {r.text[:200]}"
              r = c.get(f"/posts/{pid}")
              assert r.status_code == 200 and r.json()["title"] == "Hello", f"fetch: {r.status_code} {r.text[:200]}"
              r = c.put(f"/posts/{pid}", json={"title": "Edited", "body": "Changed"})
              if r.status_code == 405:
                  r = c.patch(f"/posts/{pid}", json={"title": "Edited", "body": "Changed"})
              assert r.status_code == 200 and c.get(f"/posts/{pid}").json()["title"] == "Edited", f"update: {r.status_code} {r.text[:200]}"
              r = c.delete(f"/posts/{pid}")
              assert r.status_code in (200, 204), f"delete: {r.status_code} {r.text[:200]}"
              assert c.get(f"/posts/{pid}").status_code == 404, "a deleted post can still be fetched"
          print("ok")
        stdout_contains: ["ok"]
  solution:
    requirements.txt: |
      fastapi
      uvicorn
      sqlalchemy
      pydantic
    main.py: |
      from datetime import datetime

      from fastapi import Depends, FastAPI, HTTPException
      from pydantic import BaseModel, ConfigDict
      from sqlalchemy import Column, DateTime, Integer, String, Text, create_engine
      from sqlalchemy.orm import Session, declarative_base, sessionmaker

      engine = create_engine("sqlite:///./blog.db", connect_args={"check_same_thread": False})
      SessionLocal = sessionmaker(bind=engine, autocommit=False, autoflush=False)
      Base = declarative_base()


      class Post(Base):
          __tablename__ = "posts"
          id = Column(Integer, primary_key=True)
          title = Column(String(200), nullable=False)
          body = Column(Text, nullable=False)
          created_at = Column(DateTime, default=datetime.utcnow, nullable=False)


      Base.metadata.create_all(bind=engine)


      class PostIn(BaseModel):
          title: str
          body: str


      class PostOut(PostIn):
          model_config = ConfigDict(from_attributes=True)
          id: int
          created_at: datetime


      app = FastAPI(title="Blog API")


      def get_db():
          db = SessionLocal()
          try:
              yield db
          finally:
              db.close()


      def _get_or_404(db: Session, post_id: int) -> Post:
          post = db.get(Post, post_id)
          if post is None:
              raise HTTPException(status_code=404, detail="Post not found")
          return post


      @app.post("/posts", response_model=PostOut, status_code=201)
      def create_post(data: PostIn, db: Session = Depends(get_db)):
          post = Post(title=data.title, body=data.body)
          db.add(post)
          db.commit()
          db.refresh(post)
          return post


      @app.get("/posts", response_model=list[PostOut])
      def list_posts(db: Session = Depends(get_db)):
          return db.query(Post).order_by(Post.id).all()


      @app.get("/posts/{post_id}", response_model=PostOut)
      def get_post(post_id: int, db: Session = Depends(get_db)):
          return _get_or_404(db, post_id)


      @app.put("/posts/{post_id}", response_model=PostOut)
      def update_post(post_id: int, data: PostIn, db: Session = Depends(get_db)):
          post = _get_or_404(db, post_id)
          post.title, post.body = data.title, data.body
          db.commit()
          db.refresh(post)
          return post


      @app.delete("/posts/{post_id}", status_code=204)
      def delete_post(post_id: int, db: Session = Depends(get_db)):
          db.delete(_get_or_404(db, post_id))
          db.commit()
  judge:
    notes: Every one of the five operations must be implemented and wired to SQLite, not stubbed or kept in memory.

- id: gen-04-wordfreq
  mode: generation
  source: hand-written
  prompt: >-
    Write a Python command line script called wordfreq.py. It takes a text file path as its only argument and
    prints the 10 most common words (lowercased, punctuation ignored), one per line, as "word count".
  expect:
    files_exist: ["wordfreq.py"]
    exec:
      - name: prints the most common words with their counts
        setup_files:
          sample.txt: "the cat and the dog and the bird. The end!"
        snippet: |
          import re, subprocess, sys
          out = subprocess.run([sys.executable, "wordfreq.py", "sample.txt"], capture_output=True, text=True, timeout=10).stdout
          counts = {m.group(1): int(m.group(2)) for m in (re.match(r"\W*(\w+)\W+(\d+)", l) for l in out.splitlines()) if m}
          assert counts.get("the") == 4 and counts.get("and") == 2, out
          assert len(counts) <= 10, out
  solution:
    wordfreq.py: |
      import re
      import sys
      from collections import Counter

      def main():
          with open(sys.argv[1], encoding="utf-8") as f:
              words = re.findall(r"[a-z0-9']+", f.read().lower())
          for word, count in Counter(words).most_common(10):
              print(f"{word} {count}")

      if __name__ == "__main__":
          main()

- id: gen-05-bank-account
  mode: generation
  source: hand-written
  prompt: >-
    Create bank.py with a BankAccount class. It starts with a balance of 0 and has deposit(amount) and
    withdraw(amount) methods and a balance property. withdraw must raise ValueError if the amount is more than
    the balance, and both methods must raise ValueError for amounts that are not positive. Also write
    test_bank.py with pytest tests for it.
  expect:
    files_exist: ["bank.py", "test_bank.py"]
    defines:
      - {file: "bank.py", names: ["BankAccount"]}
    exec:
      - name: BankAccount behaves as specified
        snippet: |
          from bank import BankAccount
          a = BankAccount()
          assert a.balance == 0
          a.deposit(50); assert a.balance == 50
          a.withdraw(20); assert a.balance == 30
          for bad in (lambda: a.withdraw(100), lambda: a.deposit(0), lambda: a.deposit(-5), lambda: a.withdraw(-1)):
              try:
                  bad()
              except ValueError:
                  pass
              else:
                  raise AssertionError("expected ValueError")
      - name: its own tests pass
        cmd: ["python", "-m", "pytest", "-q", "-p", "no:cacheprovider"]
        stdout_contains: ["passed"]
        timeout: 60
  solution:
    bank.py: |
      class BankAccount:
          def __init__(self):
              self._balance = 0

          @property
          def balance(self):
              return self._balance

          def deposit(self, amount):
              if amount <= 0:
                  raise ValueError("amount must be positive")
              self._balance += amount

          def withdraw(self, amount):
              if amount <= 0:
                  raise ValueError("amount must be positive")
              if amount > self._balance:
                  raise ValueError("insufficient funds")
              self._balance -= amount
    test_bank.py: |
      import pytest
      from bank import BankAccount

      def test_starts_at_zero():
          assert BankAccount().balance == 0

      def test_deposit_and_withdraw():
          a = BankAccount()
          a.deposit(10)
          a.withdraw(4)
          assert a.balance == 6

      def test_overdraft_raises():
          with pytest.raises(ValueError):
              BankAccount().withdraw(1)

      @pytest.mark.parametrize("amount", [0, -5])
      def test_deposit_rejects_non_positive_amounts(amount):
          with pytest.raises(ValueError):
              BankAccount().deposit(amount)

      @pytest.mark.parametrize("amount", [0, -5])
      def test_withdraw_rejects_non_positive_amounts(amount):
          a = BankAccount()
          a.deposit(10)
          with pytest.raises(ValueError):
              a.withdraw(amount)
  judge:
    notes: The tests must genuinely exercise deposit, withdraw and the error cases, not just import the class.

- id: gen-07-csv-to-json
  mode: generation
  source: hand-written
  prompt: >-
    Write a Python script csv2json.py that reads the CSV file given as its first argument (columns: name,score)
    and prints a JSON array of objects where "name" is a string and "score" is an integer.
  expect:
    files_exist: ["csv2json.py"]
    exec:
      - name: converts rows with the right types
        setup_files:
          data.csv: "name,score\nada,90\nbob,75\n"
        snippet: |
          import json, subprocess, sys
          out = subprocess.run([sys.executable, "csv2json.py", "data.csv"], capture_output=True, text=True, timeout=10).stdout
          assert json.loads(out) == [{"name": "ada", "score": 90}, {"name": "bob", "score": 75}], out
  solution:
    csv2json.py: |
      import csv
      import json
      import sys

      with open(sys.argv[1], newline="", encoding="utf-8") as f:
          rows = [{"name": r["name"], "score": int(r["score"])} for r in csv.DictReader(f)]
      print(json.dumps(rows))
