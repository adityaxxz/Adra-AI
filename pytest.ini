[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    integration: needs a real Postgres (TEST_DATABASE_URL, or the local docker-compose one); skipped when unavailable
    live: calls real LLM/embedding/tracing APIs and costs money - never run by default or in CI
addopts = -ra -m "not live"
filterwarnings =
    ignore::UserWarning:qdrant_client
    ignore::DeprecationWarning
